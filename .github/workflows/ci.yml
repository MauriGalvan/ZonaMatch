name: CI

on:
  pull_request:
    branches: [Development, main]
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository files for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir /github/workspace --redact=100

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore ZonaMatch.slnx
      - run: dotnet build ZonaMatch.slnx -c Release --no-restore
      - name: Run tests and collect coverage
        run: dotnet test ZonaMatch.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Generate coverage summary
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" dotnet-reportgenerator-globaltool --version 5.5.12
          "$RUNNER_TEMP/tools/reportgenerator" "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:TestResults/CoverageReport" "-reporttypes:Html;Cobertura;MarkdownSummaryGithub" "-assemblyfilters:+ZonaMatch.Api;+ZonaMatch.Application;+ZonaMatch.Domain;+ZonaMatch.Infrastructure"
          cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          echo "Minimum required production line coverage: 90%." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce 90% production line coverage
        run: |
          python3 -c "import sys, xml.etree.ElementTree as ET; line_rate = float(ET.parse('TestResults/CoverageReport/Cobertura.xml').getroot().attrib['line-rate']) * 100; print(f'Production line coverage: {line_rate:.2f}% (minimum: 90%)'); sys.exit(0 if line_rate >= 90 else 1)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
