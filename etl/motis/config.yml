# MOTIS configuration (multimodal routing engine) for the AMBA.
# DATOS-ZONAS-DOCKER.bat copies this file to datos\motis\ with the map and GTFS feeds, then runs the import.
#
# Public GTFS feeds are from 2019 and 2020 and their dates do not overlap. Each feed therefore uses its own weekly
# calendar files (etl\motis\calendar-*.txt), projected onto a reference week without holidays: Monday, March 2 through
# Sunday, March 8, 2026. Public transit queries use that week (a typical weekday, Saturday, or Sunday).

osm: amba.osm.pbf
timetable:
  first_day: 2026-03-02
  num_days: 8
  tb: false
  railviz: false
  # Route geometry (shapes.txt from bus and train GTFS feeds): without it, transit legs are drawn as straight
  # lines between stops.
  with_shapes: true
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  datasets:
    colectivo:
      path: gtfs/colectivo
    tren:
      path: gtfs/tren
    subte:
      path: gtfs/subte
elevators: false
street_routing: true
osr_footpath: true
geocoding: false
reverse_geocoding: false
