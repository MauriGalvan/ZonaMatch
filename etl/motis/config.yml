# Configuracion de MOTIS (motor de ruteo multimodal) para el AMBA.
# DATOS-ZONAS-DOCKER.bat la copia a datos\motis\ junto con el mapa y los GTFS, y corre la importacion.
#
# Los GTFS publicos son de 2019 y 2020 y sus fechas no se superponen. Por eso cada feed se usa con un
# calendario semanal propio (etl\motis\calendario-*.txt) proyectado a una semana de referencia sin
# feriados: lunes 2 a domingo 8 de marzo de 2026. Las consultas de transporte publico se hacen sobre esa
# semana (un dia habil, un sabado o un domingo tipicos).

osm: amba.osm.pbf
timetable:
  first_day: 2026-03-02
  num_days: 8
  tb: false
  railviz: false
  with_shapes: false
  adjust_footpaths: true
  merge_dupes_intra_src: false
  merge_dupes_inter_src: false
  link_stop_distance: 100
  update_interval: 60
  http_timeout: 30
  canned_rt: false
  incremental_rt_update: false
  extend_missing_footpaths: false
  max_footpath_length: 15
  default_transfer_time: 2
  max_matching_distance: 25.000000
  preprocess_max_matching_distance: 250.000000
  datasets:
    colectivo:
      path: gtfs/colectivo
    tren:
      path: gtfs/tren
    subte:
      path: gtfs/subte
elevators: false
street_routing: true
osr_footpath: true
geocoding: false
reverse_geocoding: false
