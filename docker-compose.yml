services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=zonamatch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      - POSTGRES_DB=zonamatch_docker
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # Routing engine (walking, cycling, driving, and public transit).
  motis:
    image: ghcr.io/motis-project/motis:2.11.3
    volumes:
      - ./datos/motis:/entrada
      - motis_data:/data
    ports:
      - "${MOTIS_PORT:-18080}:8080"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/importacion-ok ]; then echo "MOTIS: routing data is missing; run ZONE-DATA-DOCKER.bat"; fi
        until [ -f /data/importacion-ok ]; do sleep 15; done
        exec /motis server -d /data

  nominatim:
    image: mediagis/nominatim:5.3
    profiles: ["nominatim"]
    environment:
      PBF_PATH: /nominatim/data/amba.osm.pbf
      THREADS: 4
      NOMINATIM_PASSWORD: zonamatch_nominatim_local
      IMPORT_WIKIPEDIA: "false"
    volumes:
      - ./datos/nominatim:/nominatim/data
      - nominatim_data:/var/lib/postgresql/16/main
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 1gb

  # Photon: place search (search-as-you-type) and reverse geocoding. The published image already
  # includes the AMBA index, so there is nothing to import: README step 6.1.
  #   docker compose --profile photon pull photon
  #   docker compose --profile photon up -d photon
  # Set PHOTON_IMAGE to use another tag (or a locally built image).
  photon:
    image: ${PHOTON_IMAGE:-ghcr.io/sergabrubio/zonamatch-photon:1}
    profiles: ["photon"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g"
    ports:
      - "127.0.0.1:2322:2322"
    restart: unless-stopped

  # Only for whoever builds or refreshes the Photon index (README step 6.2): it imports the GraphHopper
  # dump cut to the AMBA into the photon_amba_data volume and can serve it on port 2324 to test it before
  # publishing the image (infrastructure repo, docs/deploy-photon-dev.md). Teammates do not need it.
  photon-amba:
    build: ./docker/photon
    profiles: ["photon-amba"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g"
    volumes:
      - photon_amba_data:/photon/photon_data
    ports:
      - "127.0.0.1:2324:2322"
    restart: unless-stopped

  # Local Azure Blob Storage emulator for the review images (see the README).
  # Optional: docker compose --profile azurite up -d azurite
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    profiles: ["azurite"]
    # Only the blob service is needed. The API version check is skipped so a newer Azure SDK keeps working.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data
    restart: unless-stopped

volumes:
  db_data:
  motis_data:
  nominatim_data:
  photon_amba_data:
  azurite_data:
