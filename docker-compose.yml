services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=zonamatch
      - POSTGRES_PASSWORD=zonamatch
      - POSTGRES_DB=zonamatch_docker
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # Motor de ruteo (a pie, bici, auto y transporte público).
  motis:
    image: ghcr.io/motis-project/motis:2.11.3
    volumes:
      - ./datos/motis:/entrada
      - motis_data:/data
    ports:
      - "${MOTIS_PORT:-18080}:8080"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/importacion-ok ]; then echo "MOTIS: faltan los datos de ruteo, correr DATOS-ZONAS-DOCKER.bat"; fi
        until [ -f /data/importacion-ok ]; do sleep 15; done
        exec /motis server -d /data

  nominatim:
    image: mediagis/nominatim:5.3
    profiles: ["nominatim"]
    environment:
      PBF_PATH: /nominatim/data/amba.osm.pbf
      THREADS: 4
      NOMINATIM_PASSWORD: zonamatch_nominatim_local
      IMPORT_WIKIPEDIA: "false"
    volumes:
      - ./datos/nominatim:/nominatim/data
      - nominatim_data:/var/lib/postgresql/16/main
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 1gb

volumes:
  db_data:
  motis_data:
  nominatim_data:
